version: 2

updates:
  # Ruby gems (Gemfile / Gemfile.lock)
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Rails minor releases (8.0 -> 8.1) are feature releases, so only
      # patches are grouped. Minor/major Rails bumps come as their own PR.
      rails:
        patterns:
          - "rails"
          - "railties"
          - "rails-i18n"
          - "action*"
          - "active*"
        update-types:
          - patch
      gems-minor-and-patch:
        exclude-patterns:
          - "rails"
          - "railties"
          - "rails-i18n"
          - "action*"
          - "active*"
        update-types:
          - minor
          - patch

  # JS packages (package.json / yarn.lock)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Keep @rails/* in lockstep with the Rails gems: patches only here,
      # minor/major bumps come as their own PR.
      rails-js:
        patterns:
          - "@rails/*"
        update-types:
          - patch
      hotwired:
        patterns:
          - "@hotwired/*"
      datatables:
        patterns:
          - "datatables.net*"
      build-tooling:
        patterns:
          - "webpack*"
          - "sass"
      js-minor-and-patch:
        exclude-patterns:
          - "@rails/*"
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
